{% extends 'base.html' %}
{% block content %}

<div class="page-header">
    <h2><i class="ti ti-receipt me-2"></i>Add Fee Record</h2>
    <p>Adding fee for <strong>{{ student.name }}</strong> — {{ student.class_name }}</p>
</div>

<div class="form-card">
    <form action="/add_fee/{{ student.id }}" method="POST">

        <div class="mb-3">
            <label class="form-label">Month <span class="text-danger">*</span></label>
            <input type="text"
                   name="month"
                   class="form-control"
                   placeholder="e.g. June 2025"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Amount (₹)</label>
            <input type="number"
                   name="amount"
                   class="form-control"
                   placeholder="e.g. 1500"
                   min="0">
        </div>

        <div class="mb-3">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="Pending">Pending</option>
                <option value="Paid">Paid</option>
            </select>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn-submit">
                <i class="ti ti-check me-1"></i> Save Fee
            </button>
            <a href="/fees" class="action-btn" style="border:1px solid var(--border);">
                Cancel
            </a>
        </div>

    </form>
</div>

{% endblock %}
