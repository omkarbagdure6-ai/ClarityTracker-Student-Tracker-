{% extends 'base.html' %}
{% block auth_content %}

<div class="auth-wrapper">
    <div class="auth-card">

        <div class="auth-logo">
            <div class="logo-icon">🎓</div>
            <h1>Clarity Tracker</h1>
            <p>Student management made simple</p>
        </div>

        <div class="auth-title">Welcome back</div>
        <div class="auth-sub">Sign in to continue to your dashboard</div>

        <form method="POST" action="{{ url_for('login') }}">

            <div class="auth-field">
                <label>Email Address</label>
                <input type="email"
                       name="email"
                       placeholder="you@example.com"
                       required
                       autofocus>
            </div>

            <div class="auth-field">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="••••••••"
                       required>
            </div>

            <button type="submit" class="auth-btn">
                Sign in →
            </button>

        </form>

        <div class="auth-footer" style="margin-top: 20px;">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create one free</a>
        </div>

        <div class="auth-footer" style="margin-top: 10px;
             font-size: 11px; opacity: 0.4;">
            Default admin — admin@tracker.com / admin123
        </div>

    </div>
</div>

{% endblock %}
